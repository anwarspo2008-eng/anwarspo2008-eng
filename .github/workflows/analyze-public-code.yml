
name: Count Total Lines of Code

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  count-lines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Count public repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: anwarspo2008-eng
        run: |
          gh api --paginate "users/$OWNER/repos?per_page=100" \
            --jq '.[] | select(.fork == false) | .clone_url' > repos.txt

          TOTAL=0
          mkdir repositories

          while read -r URL; do
            NAME=$(basename "$URL" .git)
            git clone --quiet --depth 1 "$URL" "repositories/$NAME"

            COUNT=$(cloc --json --quiet "repositories/$NAME" \
              | jq '.SUM.code // 0')

            TOTAL=$((TOTAL + COUNT))
          done < repos.txt

          echo "TOTAL=$TOTAL" >> "$GITHUB_ENV"

      - name: Update README
        run: |
          python3 - <<'PY'
          import os

          path = "README.md"
          total = os.environ["TOTAL"]

          with open(path, "r") as f:
              content = f.read()

          start = "<!-- LOC-START -->"
          end = "<!-- LOC-END -->"

          new_text = f"{start}\nTotal lines of code: {total}\n{end}"

          before, rest = content.split(start, 1)
          _, after = rest.split(end, 1)

          with open(path, "w") as f:
              f.write(before + new_text + after)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (
            git commit -m "Update total lines of code"
            git push
          )
